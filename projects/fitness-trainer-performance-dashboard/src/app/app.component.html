<div class="app-shell">
  <div class="app-shell__header">
    <app-trainer-header
      [profile]="profile()"
      [state]="headerState()"
      (previousRequested)="previous()"
      (nextRequested)="next()"
    />
  </div>
  <main class="app-shell__main" role="main">
    <router-outlet />
  </main>
  <div class="app-shell__toasts">
    <app-toast-host [toasts]="toasts()" (dismissed)="dismiss($event)" />
  </div>
</div>
