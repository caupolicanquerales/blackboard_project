<ul class="step-cards">
  @for (step of steps(); track step.id) {
    <li>
      <button
        type="button"
        class="step-card"
        [class.step-card--selected]="step.id === selectedStepId()"
        [class.step-card--completed]="step.isCompleted"
        [attr.aria-pressed]="step.id === selectedStepId()"
        (click)="select(step.id)"
      >
        <span class="step-card__label">STEP {{ step.stepNumber < 10 ? '0' + step.stepNumber : step.stepNumber }}</span>
        <span class="step-card__title">{{ step.title }}</span>
        <span class="step-card__description">{{ step.description }}</span>
        @if (step.isCompleted) {
          <span class="step-card__check" role="img" aria-label="Step completed">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        }
      </button>
    </li>
  }
</ul>
