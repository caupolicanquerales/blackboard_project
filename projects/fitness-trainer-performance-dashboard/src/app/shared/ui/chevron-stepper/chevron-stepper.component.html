@switch (state()) {
  @case ('loading') {
    <div class="stepper stepper--loading" role="status" aria-busy="true">Loading phases…</div>
  }
  @case ('empty') {
    <div class="stepper stepper--empty" role="status">No phases available.</div>
  }
  @case ('error') {
    <div class="stepper stepper--error" role="alert">Unable to load phases.</div>
  }
  @default {
    <ol class="stepper" role="list" aria-label="Workout phases">
      @for (phase of phases(); track phase.id; let i = $index) {
        <li class="stepper__item">
          <button
            type="button"
            class="chevron"
            [class.chevron--active]="phase.id === currentId()"
            [class.chevron--completed]="phase.status === 'COMPLETED'"
            [class.chevron--first]="i === 0"
            [attr.aria-label]="'Step ' + (i + 1) + ': ' + phase.phaseName + ', ' + phase.completionPercentage + '% complete, ' + (phase.status === 'COMPLETED' ? 'completed' : phase.status === 'IN_PROGRESS' ? 'in progress' : 'pending')"
            [attr.aria-current]="phase.id === currentId() ? 'step' : null"
            (click)="select(phase.id)"
          >
            <span class="chevron__step" aria-hidden="true">STEP {{ i + 1 < 10 ? '0' : '' }}{{ i + 1 }}</span>
            <span class="chevron__name">{{ phase.phaseName }}</span>
            <span class="chevron__pct">{{ phase.completionPercentage }}%</span>
          </button>
        </li>
      }
    </ol>
  }
}
