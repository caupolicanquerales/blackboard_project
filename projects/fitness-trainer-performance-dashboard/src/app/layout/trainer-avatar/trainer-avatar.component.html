@switch (view()) {
  @case ('loading') {
    <div class="avatar avatar--skeleton" aria-busy="true"></div>
  }
  @case ('image') {
    <img class="avatar" [src]="avatar()" [alt]="displayName()" (error)="onImageError()" />
  }
  @case ('error') {
    <div class="avatar avatar--error" role="img" aria-label="Avatar unavailable">!</div>
  }
  @default {
    <div class="avatar avatar--placeholder" role="img" [attr.aria-label]="displayName() || 'Trainer avatar'">
      {{ initial() || '?' }}
    </div>
  }
}
