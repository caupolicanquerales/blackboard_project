<header class="header" role="banner" [attr.aria-busy]="state() === 'loading'">
  <div class="header__avatar">
    <app-trainer-avatar
      [avatar]="profile()?.avatar ?? null"
      [displayName]="profile()?.displayName ?? ''"
      [state]="state()"
    />
  </div>
  <div class="header__text">
    <h1 class="header__title">PERSONAL TRAINER</h1>
    @if (profile(); as p) {
      <a class="header__link" [href]="p.websiteUrl" target="_blank" rel="noopener">{{ p.websiteUrl }}</a>
    } @else if (state() === 'loading') {
      <span class="header__skeleton" aria-hidden="true"></span>
    }
  </div>
  <nav class="header__actions" aria-label="Trainer navigation">
    <button class="header__arrow" type="button" aria-label="Previous page" (click)="previousRequested.emit()">
      <app-icon name="arrow-left" />
    </button>
    <button class="header__arrow" type="button" aria-label="Next page" (click)="nextRequested.emit()">
      <app-icon name="arrow-right" />
    </button>
  </nav>
</header>
