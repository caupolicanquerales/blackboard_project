<section class="toast-region" role="region" aria-live="polite" aria-label="Notifications">
  <ul class="toast-list">
    @for (toast of toasts(); track toast.id) {
      <li [class]="'toast toast--' + toast.severity">
        <svg class="toast__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          @switch (toast.severity) {
            @case ('success') {
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            }
            @case ('warning') {
              <path d="M12 3L2.5 20h19L12 3z M12 10v5 M12 17.5v.5" />
            }
            @case ('error') {
              <path d="M12 3l9 9-9 9-9-9 9-9z M12 8v5 M12 15.5v.5" />
            }
            @default {
              <path d="M12 3a9 9 0 100 18 9 9 0 000-18z M12 11v6 M12 7.5v.5" />
            }
          }
        </svg>
        <span class="toast__message">
          <span class="toast__severity">{{ toast.severity }}:</span>
          {{ toast.message }}
        </span>
        <button
          type="button"
          class="toast__dismiss"
          [attr.aria-label]="'Dismiss ' + toast.severity + ' notification: ' + toast.message"
          (click)="dismiss(toast.id)"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12 M18 6L6 18" />
          </svg>
        </button>
      </li>
    }
  </ul>
</section>
