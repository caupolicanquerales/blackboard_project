<section class="routines-grid">
  <div class="routines-grid__phases">
    <app-chevron-stepper
      [phases]="store.phases()"
      [state]="state()"
      [activePhaseId]="activePhaseId()"
    />
    <button type="button" class="routines-grid__advance" (click)="store.advancePhase()">
      Advance to next phase
    </button>
    @if (store.phaseFeedback(); as feedback) {
      <p class="routines-grid__feedback" role="status" aria-live="polite">{{ feedback }}</p>
    }
  </div>
  <div class="routines-grid__steps">
    <app-step-card-list
      [steps]="store.steps()"
      [state]="state()"
      [selectedStepId]="selectedStepId()"
      [showActions]="true"
      (stepSelected)="store.selectStep($event)"
      (stepCompleted)="store.completeStep($event)"
    />
  </div>
  <div class="routines-grid__detail">
    <app-step-detail
      [step]="store.selectedStep()"
      [state]="state()"
      (completeRequested)="store.completeStep($event)"
    />
  </div>
</section>
