<div class="tiles">
  <div class="tile tile--heart" role="group" aria-label="Heart rate">
    <svg class="tile__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 2.9 5 6.2 5c2.1 0 3.7 1.2 5.8 3.4C14.1 6.2 15.7 5 17.8 5 21.1 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z" />
    </svg>
    <span class="tile__label">Heart rate</span>
    <span class="tile__value">{{ metric()?.heartRate ?? '--' }}</span>
    <span class="tile__detail">bpm</span>
  </div>
  <div class="tile tile--lungs" role="group" aria-label="Respiratory rate">
    <svg class="tile__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 3v9M12 12c-1 3-3 4-5 4-2.5 0-3.5 2-3.5 3.5S5 21 7 21c3 0 5-3 5-9zm0 0c1 3 3 4 5 4 2.5 0 3.5 2 3.5 3.5S19 21 17 21c-3 0-5-3-5-9z" />
    </svg>
    <span class="tile__label">Respiratory rate</span>
    <span class="tile__value">{{ metric()?.respiratoryRate ?? '--' }}</span>
    <span class="tile__detail">breaths/min</span>
  </div>
  <div class="tile tile--weight" role="group" aria-label="Weight volume">
    <svg class="tile__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14" />
    </svg>
    <span class="tile__label">Weight volume</span>
    <span class="tile__value">{{ metric()?.trainingLoad ?? '--' }}</span>
    <span class="tile__detail">kg lifted</span>
  </div>
</div>
