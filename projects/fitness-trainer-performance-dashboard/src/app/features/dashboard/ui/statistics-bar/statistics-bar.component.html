<div class="statistics-bar" [attr.data-state]="state()">
  <div class="statistics-bar__header">
    <span class="statistics-bar__label" id="workout-intensity-label">Workout Intensity</span>
    @if (state() === 'success' && metric()) {
      <span class="statistics-bar__value">{{ percent() }}%</span>
    }
  </div>
  @if (state() === 'success' && metric()) {
    <div
      class="statistics-bar__track"
      role="meter"
      aria-labelledby="workout-intensity-label"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="percent()"
      [attr.aria-valuetext]="percent() + ' percent'"
      tabindex="0"
    >
      <div class="statistics-bar__fill" [style.width.%]="percent()"></div>
    </div>
  } @else {
    <div class="statistics-bar__track statistics-bar__track--idle" aria-hidden="true"></div>
    <span
      class="statistics-bar__message"
      [attr.role]="state() === 'error' ? 'alert' : 'status'"
    >{{ state() === 'loading' ? 'Loading…' : state() === 'error' ? 'Unable to load' : 'No data' }}</span>
  }
</div>
