<section class="bars" aria-label="Training ratio comparison">
  @for (ratio of ratios(); track ratio.id) {
    <div class="bar-row">
      <span class="label">{{ ratio.categoryLabel }}</span>
      <div class="bar">
        <div
          class="primary"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="ratio.primaryPercentage"
          [attr.aria-label]="ratio.categoryLabel + ' primary share'"
          [style.width.%]="ratio.primaryPercentage"
        >
          <span class="value">{{ ratio.primaryPercentage }}%</span>
        </div>
        <div
          class="secondary"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="ratio.secondaryPercentage"
          [attr.aria-label]="ratio.categoryLabel + ' secondary share'"
          [style.width.%]="ratio.secondaryPercentage"
        >
          <span class="value">{{ ratio.secondaryPercentage }}%</span>
        </div>
      </div>
    </div>
  }
</section>
