<div class="dashboard-grid">
  <section class="region region--tiles">
    <app-biometric-tiles [metric]="telemetry.metric()" [state]="metricState()" />
  </section>
  <section class="region region--bars">
    <app-comparison-split-bars
      [ratios]="store.ratios()"
      [state]="ratiosState()"
      (resetRequested)="store.resetRatios()"
    />
  </section>
  <section class="region region--gauges">
    <app-radial-gauges [phases]="store.phases()" [state]="phasesState()" />
  </section>
  <section class="region region--timeline">
    <app-chevron-stepper [phases]="store.phases()" [state]="phasesState()" />
  </section>
  <section class="region region--steps">
    <app-step-card-list [steps]="store.steps()" [state]="stepsState()" />
  </section>
  <section class="region region--stats">
    <app-statistics-bar [metric]="telemetry.metric()" [state]="metricState()" />
  </section>
</div>
